name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Postgres (+ blockforge_test), VictoriaMetrics flags and HTTPS MinIO as local development.
      - name: Test infrastructure (infra/compose)
        run: pnpm infra:up
      - name: Agent protocol fixtures are up to date
        run: node packages/contracts/scripts/gen-fixtures.mjs && git diff --exit-code packages/contracts/fixtures
      - run: pnpm typecheck
      - name: TypeScript 6 type check (ESLint, vitest and editors still use TypeScript 6)
        run: pnpm typecheck:ts6
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Emit parity (tsc-rs dist against TypeScript 6, scripts/ci/typescript6.mjs)
        run: pnpm emit-parity
      - name: Emit parity selftest (comparison and discovery cases)
        run: node scripts/ci/typescript6.mjs selftest
      - name: Web route bundle budget (300 KiB gzip per route)
        run: pnpm --filter @blockforge/web bundle:check

  node-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/node-agent/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Integration tests (real Docker)
        run: go test -tags integration ./...
      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/blockforge-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/blockforge-agent
