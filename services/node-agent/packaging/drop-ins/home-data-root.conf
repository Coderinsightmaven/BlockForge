# Drop-in for a data root below /home (e.g. /home/game/blockforge).
#
# The unit default ProtectHome=yes replaces /home with an empty, inaccessible directory, so a data
# root below it fails even when listed in ReadWritePaths. This drop-in keeps the rest of /home
# read-only for the agent and makes only the data root writable.
#
# Install (edit the path first):
#   sudo install -D -m 0644 home-data-root.conf /etc/systemd/system/blockforge-agent.service.d/home-data-root.conf
#   sudo systemctl daemon-reload && sudo systemctl restart blockforge-agent
[Service]
ProtectHome=read-only
ReadWritePaths=/home/game/blockforge
# If the data root belongs to an existing login user (workloads then run as that uid/gid), run the
# agent as that user instead of `blockforge`:
#User=game
#Group=game
